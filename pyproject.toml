[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-ai-skills-framework"
dynamic = ["version"]
description = "ai-skills-framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Imran Qureshi", email = "imran.qureshi@bwell.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.0,<3.0.0",
    "fsspec>=2026.2.0",
    "httpx>=0.27.0",
    "simple-container>=1.0.2",
    "skillkit>=0.4.0",
    "aiofiles>=25.1.0",
    "uv>=0.11.0",
    "anyio>=4.12.1",
    "motor>=3.7.1",
    "skills-ref>=0.1.1",
    "py-key-value-aio>=0.4.4",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.0.0",
    "langchain>=1.0.0",
    "langgraph>=0.2.0",
]
agentcore = [
    "boto3>=1.34.59",
]

[project.urls]
Homepage = "https://github.com/icanbwell/ai-skills"

[dependency-groups]
dev = [
    "langchain-ai-skills-framework[langchain]",
    "setuptools>=60.9.3",
    "packaging>=26.0",
    "wheel>=0.43.0",
    "twine>=4.0.2",
    "pre-commit>=3.6.1",
    "autoflake>=2.2.0",
    "mypy>=1.8.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "black>=24.2.0",
    "bandit>=1.8.3",
    "ruff>=0.11.5",
    "pytest-cov>=6.1.1",
    "types-pyyaml>=6.0.12",
    "build>=1.0.0",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["langchain_ai_skills_framework*"]

[tool.setuptools.package-data]
langchain_ai_skills_framework = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--capture=fd"
log_cli = true
log_cli_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["fsspec", "fsspec.*", "skills_ref.*", "setuptools.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.bandit]
skips = ["B101", "B105", "B106"]

[[tool.uv.index]]
name = "alpine-wheels"
url = "https://imranq2.github.io/alpine-wheels/docs/"